<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的静态网页</title>
  <meta name="description" content="一个简单、现代的静态 index.html 示例页面" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #38bdf8;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e293b, transparent), var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      padding: 64px 20px 40px;
      text-align: center;
    }
    header h1 {
      font-size: clamp(28px, 5vw, 48px);
      margin: 0 0 12px;
    }
    header p {
      color: var(--muted);
      margin: 0 auto;
      max-width: 680px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 64px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 32px;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
    .card h3 { margin-top: 0; }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(56,189,248,.15);
      color: var(--primary);
      font-size: 12px;
      margin-bottom: 10px;
    }
    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,.15);
      background: transparent;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s ease, border-color .2s ease, transform .1s ease;
    }
    .btn.primary {
      background: linear-gradient(180deg, rgba(56,189,248,.25), rgba(56,189,248,.15));
      border-color: rgba(56,189,248,.5);
      color: #e6f6ff;
    }
    .btn.accent {
      background: linear-gradient(180deg, rgba(34,197,94,.25), rgba(34,197,94,.15));
      border-color: rgba(34,197,94,.5);
      color: #eafff1;
    }
    .btn:hover { transform: translateY(-1px); }
    footer {
      border-top: 1px solid rgba(255,255,255,.08);
      padding: 24px 20px 40px;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <header>
